<style>

<body>

  <p class="note">Everything runs in your browser. The screenshot is never uploaded. The OCR engine loads once from a public CDN, so the first scan needs internet; later scans are quick. Always check the three fields against the screen before using them.</p>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), bar = $('bar'), barFill = bar.firstElementChild;
let worker = null, busy = false;

function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = cls || ''; }

async function getWorker(){
  if (worker) return worker;
  worker = await Tesseract.createWorker('eng', 1, {
    logger: m => {
      if (m.status === 'recognizing text') barFill.style.width = Math.round(m.progress*100)+'%';
    }
  });
  return worker;
}

/* Upscale small screenshots: OCR is noticeably more accurate on larger text */
function prepare(blob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const scale = img.width < 1800 ? 2 : 1;
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, c.width, c.height);
      $('preview').src = url; $('preview').style.display = 'block';
      c.toBlob(b => b ? resolve(b) : reject(new Error('Image error')), 'image/png');
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

function clean(s){ return (s||'').replace(/[|_]+/g,' ').replace(/\\s+/g,' ').trim(); }

function parse(text){
  const lines = text.split(/\\r?\\n/).map(l => l.trim()).filter(Boolean);
  const flat = text.replace(/\\r?\\n/g,'  ');
  let mrn = '', dob = '', name = '';

  // MRN: label followed by a code (letters/digits/dashes). Fix common O/0 slips only if digits dominate.
  let m = flat.match(/\\b(?:MRN|M\\.?R\\.?N\\.?|Med(?:ical)?\\s*Rec(?:ord)?\\s*(?:No|Number|#)?)\\s*[:#\\-]?\\s*([A-Za-z0-9][A-Za-z0-9\\-]{3,})/i);
  if (m) mrn = m[1];

  // DOB: label then a date like 01/02/1980, 1-2-80, 01.02.1980, or "Jan 2, 1980"
  const dateRe = '(\\\\d{1,2}\\\\s*[\\\\/\\\\-.]\\\\s*\\\\d{1,2}\\\\s*[\\\\/\\\\-.]\\\\s*\\\\d{2,4}|\\\\d{4}\\\\s*[\\\\/\\\\-.]\\\\s*\\\\d{1,2}\\\\s*[\\\\/\\\\-.]\\\\s*\\\\d{1,2}|[A-Za-z]{3,9}\\\\.?\\\\s+\\\\d{1,2},?\\\\s+\\\\d{4}|\\\\d{1,2}\\\\s+[A-Za-z]{3,9}\\\\.?,?\\\\s+\\\\d{4})';
  m = flat.match(new RegExp('(?:DOB|D\\\\.O\\\\.B\\\\.?|Date\\\\s*of\\\\s*Birth|Birth\\\\s*Date|Birthdate)\\\\s*[:#\\\\-]?\\\\s*' + dateRe, 'i'));
  if (m) dob = m[1].replace(/\\s*([\\/\\-.])\\s*/g,'$1');

  // Name: labelled line first; else "Last, First" line near the top
  for (const l of lines){
    const nm = l.match(/^(?:Patient\\s*)?Name\\s*[:\\-]?\\s*(.+)$/i) || l.match(/\\bPatient\\s*[:\\-]\\s*(.+)$/i);
    if (nm){
      let v = nm[1].split(/\\s{2,}|\\b(?:MRN|DOB|Date of Birth|Age|Sex|Gender|DOS|Visit|Acct|Account)\\b/i)[0];
      v = clean(v.replace(/[^A-Za-z ,.'\\-]/g,' '));
      if (v.length > 2){ name = v; break; }
    }
  }
  if (!name){
    m = flat.match(/\\b([A-Z][A-Za-z'\\-]+,\\s*[A-Z][A-Za-z'\\-]+(?:\\s+[A-Z][A-Za-z'\\-]*\\.?)?)/);
    if (m) name = m[1];
  }
  return { name: clean(name), mrn: mrn.trim(), dob: dob.trim() };
}

function formatted(){
  const n = $('name').value.trim(), r = $('mrn').value.trim(), d = $('dob').value.trim();
  switch ($('fmt').value){
    case 'tab':   return [n,r,d].join('\\t');
    case 'comma': return [n,r,d].join(', ');
    case 'mrn':   return r;
    default:      return 'Name: '+n+'\\nMRN: '+r+'\\nDOB: '+d;
  }
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}

async function copyAll(auto){
  const ok = await copyText(formatted());
  if (ok) setStatus('Copied to clipboard. Paste it where you need it.', 'ok');
  else setStatus('Could not copy automatically. Press "Copy again".', 'warn');
}

async function handleBlob(blob){
  if (busy) return;
  busy = true;
  $('result').style.display = 'none';
  bar.style.display = 'block'; barFill.style.width = '0';
  try {
    setStatus('Reading screenshot…');
    const img = await prepare(blob);
    setStatus(worker ? 'Reading text…' : 'Loading OCR engine (first time only)…');
    const w = await getWorker();
    setStatus('Reading text…');
    const { data } = await w.recognize(img);
    $('raw').textContent = data.text;
    const f = parse(data.text);
    $('name').value = f.name; $('mrn').value = f.mrn; $('dob').value = f.dob;
    ['name','mrn','dob'].forEach(k => $(k).classList.toggle('miss', !f[k]));
    $('result').style.display = 'block';
    const missing = ['name','mrn','dob'].filter(k => !f[k]);
    if (missing.length === 3){
      setStatus('Found no Name, MRN or DOB. Check the "Text the OCR read" box below, or try a tighter screenshot.', 'warn');
    } else {
      await copyAll(true);
      if (missing.length) setStatus(statusEl.textContent + ' Missing: ' + missing.map(s=>s.toUpperCase()).join(', ') + '. Type it in and press "Copy again".', 'warn');
    }
  } catch(err){
    setStatus('Something went wrong: ' + err.message + '. Check your internet connection for the first scan.', 'warn');
  } finally {
    bar.style.display = 'none'; busy = false;
  }
}

/* Ctrl+V anywhere on the page */
document.addEventListener('paste', e => {
  if (e.target.matches('input,textarea')) return;
  const items = e.clipboardData ? [...e.clipboardData.items] : [];
  const it = items.find(i => i.type.startsWith('image/'));
  if (it){ e.preventDefault(); handleBlob(it.getAsFile()); }
  else setStatus('No image on the clipboard. Take a screenshot first, then paste.', 'warn');
});

/* Button: read clipboard directly */
$('pasteBtn').onclick = async () => {
  try {
    const clip = await navigator.clipboard.read();
    for (const item of clip){
      const type = item.types.find(t => t.startsWith('image/'));
      if (type){ return handleBlob(await item.getType(type)); }
    }
    setStatus('No image on the clipboard. Take a screenshot first.', 'warn');
  } catch(e){ setStatus('Browser blocked clipboard access. Click the box and press Ctrl+V instead.', 'warn'); }
};

/* File picker and drag-drop */
$('fileBtn').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) handleBlob(e.target.files[0]); e.target.value=''; };
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hot'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hot'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hot');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) handleBlob(f);
});

document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const ok = await copyText($(b.dataset.copy).value);
  setStatus(ok ? b.dataset.copy.toUpperCase() + ' copied.' : 'Could not copy.', ok ? 'ok' : 'warn');
});
$('copyAll').onclick = () => copyAll(false);
$('fmt').onchange = () => { try{localStorage.setItem('pig-fmt', $('fmt').value);}catch(e){} };
try { const s = localStorage.getItem('pig-fmt'); if (s) $('fmt').value = s; } catch(e){}
drop.focus();
<\/script>
</body>
</html>

  };
  const loaded = {};
  const SLUGS = { 'character-counter': 'counter', 'patient-id-grabber': 'patient' };
  const SLUG_OF = { counter: 'character-counter', patient: 'patient-id-grabber' };

  function load(id){
    if (loaded[id]) return;
    const f = document.createElement('iframe');
    f.title = id;
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    f.srcdoc = TOOLS[id];
    document.getElementById(id).appendChild(f);
    loaded[id] = f;
  }

  function show(id){
    document.getElementById('home').style.display = id === 'home' ? 'flex' : 'none';
    ['counter','patient'].forEach(t => document.getElementById(t).classList.toggle('show', t === id));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    if (id !== 'home'){
      load(id);
      setTimeout(() => { try { loaded[id].focus(); loaded[id].contentWindow.focus(); } catch(e){} }, 60);
    }
    try { history.replaceState(null, '', id === 'home' ? location.pathname + location.search : '#' + SLUG_OF[id]); } catch(e){}
  }

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.tab));
  function route(){
    const slug = (location.hash || '').slice(1);
    show(SLUGS[slug] || 'home');
  }
  window.addEventListener('hashchange', route);
  route();
</script>
